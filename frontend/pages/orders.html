<!-- Production Orders Page -->
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div>
        <h4 class="fw-bold mb-0">Production Orders</h4>
        <p class="text-muted small mb-0">Manage manufacturing work orders, priorities, lifecycle transitions, operation progress, and material allocations.</p>
    </div>
    <button class="btn btn-indigo btn-sm" id="btnNewOrder">
        <i class="bi bi-plus-lg me-1"></i>Create Production Order
    </button>
</div>

<div class="enterprise-card mb-3">
    <div class="card-body py-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small fw-semibold mb-1">Search</label>
                <input type="text" id="ordersSearch" class="form-control form-control-sm" placeholder="Order ID, Product, Customer...">
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold mb-1">Status</label>
                <select id="ordersStatusFilter" class="form-select form-select-sm">
                    <option value="">All Statuses</option>
                    <option>Draft</option><option>Released</option><option>Planned</option>
                    <option>Scheduled</option><option>In Progress</option><option>Completed</option>
                    <option>Delayed</option><option>Cancelled</option><option>Infeasible</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold mb-1">Priority</label>
                <select id="ordersPriorityFilter" class="form-select form-select-sm">
                    <option value="">All</option>
                    <option value="1">1 - Urgent</option>
                    <option value="2">2 - High</option>
                    <option value="3">3 - Medium</option>
                    <option value="4">4 - Normal</option>
                    <option value="5">5 - Low</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold mb-1">Sort By</label>
                <select id="ordersSortBy" class="form-select form-select-sm">
                    <option value="order_id">Order ID</option>
                    <option value="due_date">Due Date</option>
                    <option value="priority">Priority</option>
                    <option value="quantity">Quantity</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-navy btn-sm flex-grow-1" id="ordersApplyFilterBtn"><i class="bi bi-funnel me-1"></i>Filter</button>
                <button class="btn btn-outline-secondary btn-sm" id="ordersResetFilterBtn">Reset</button>
            </div>
        </div>
    </div>
</div>

<div class="enterprise-card">
    <div class="table-responsive">
        <table class="table table-enterprise table-hover">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Product</th>
                    <th>Customer</th>
                    <th>Qty</th>
                    <th>Priority</th>
                    <th>Release</th>
                    <th>Due Date</th>
                    <th>Progress</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center py-2 px-3">
        <span class="small text-muted" id="ordersPageInfo">Loading...</span>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" id="ordersPrevBtn">Previous</button>
            <button class="btn btn-outline-secondary" id="ordersNextBtn">Next</button>
        </div>
    </div>
</div>

<!-- Create / Edit Order Modal -->
<div class="modal fade" id="orderFormModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form class="modal-content" id="orderForm">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="orderModalTitle">Create Production Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body row g-3">
                <input type="hidden" id="orderEditId">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Product SKU</label>
                    <select id="orderProductSelect" class="form-select form-select-sm" required></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Quantity</label>
                    <input type="number" id="orderQuantityInput" class="form-control form-control-sm" min="1" value="50" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Priority (1-5)</label>
                    <input type="number" id="orderPriorityInput" class="form-control form-control-sm" min="1" max="5" value="3" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">Customer Name</label>
                    <input type="text" id="orderCustomerInput" class="form-control form-control-sm" placeholder="Apex Automotive" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">Release Date</label>
                    <input type="datetime-local" id="orderReleaseInput" class="form-control form-control-sm" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">Due Date</label>
                    <input type="datetime-local" id="orderDueInput" class="form-control form-control-sm" required>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="orderUrgentInput">
                        <label class="form-check-label small" for="orderUrgentInput">Mark as Urgent Expedite Order</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-indigo btn-sm">Save Production Order</button>
            </div>
        </form>
    </div>
</div>

<!-- Order Detail Modal -->
<div class="modal fade" id="orderDetailModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="orderDetailTitle">Order Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="orderDetailBody"></div>
        </div>
    </div>
</div>
