<!-- Products Catalog Page -->
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div>
        <h4 class="fw-bold mb-0">Products & SKU Master</h4>
        <p class="text-muted small mb-0">Manage manufactured SKUs, unit of measure, standard batch sizes, and active status.</p>
    </div>
    <button class="btn btn-indigo btn-sm" id="btnNewProduct"><i class="bi bi-plus-lg me-1"></i>Add Product</button>
</div>

<div class="enterprise-card mb-3">
    <div class="card-body py-3 d-flex flex-wrap gap-2">
        <input type="text" id="prodSearch" class="form-control form-control-sm" style="max-width:260px" placeholder="Search Product ID, SKU or Name">
        <select id="prodStatusFilter" class="form-select form-select-sm" style="max-width:170px">
            <option value="">All Status</option>
            <option>Active</option><option>Discontinued</option>
        </select>
        <button class="btn btn-navy btn-sm" id="prodFilterBtn">Apply</button>
    </div>
</div>

<div class="enterprise-card">
    <div class="table-responsive">
        <table class="table table-enterprise table-hover">
            <thead>
                <tr><th>Product ID</th><th>SKU</th><th>Name</th><th>Category</th><th>UoM</th><th>Batch Size</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="productForm">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="productModalTitle">Add Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body row g-2">
                <input type="hidden" id="prodEditId">
                <div class="col-md-6"><label class="form-label small fw-semibold">SKU Code</label><input id="prodSku" class="form-control form-control-sm" required></div>
                <div class="col-md-6"><label class="form-label small fw-semibold">Category</label><input id="prodCategory" class="form-control form-control-sm" value="Precision Components" required></div>
                <div class="col-12"><label class="form-label small fw-semibold">Product Name</label><input id="prodName" class="form-control form-control-sm" required></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Unit</label><input id="prodUom" class="form-control form-control-sm" value="pcs" required></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Batch Size</label><input type="number" id="prodBatch" class="form-control form-control-sm" min="1" value="25" required></div>
                <div class="col-md-4"><label class="form-label small fw-semibold">Status</label><select id="prodStatus" class="form-select form-select-sm"><option>Active</option><option>Discontinued</option></select></div>
                <div class="col-12"><label class="form-label small fw-semibold">Description</label><textarea id="prodDesc" class="form-control form-control-sm" rows="2"></textarea></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-indigo btn-sm">Save Product</button>
            </div>
        </form>
    </div>
</div>
